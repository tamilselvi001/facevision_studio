# Render blueprint — free tier, every feature enabled.
#
# The app runs FaceNet on ONNX Runtime instead of TensorFlow, so the whole
# service peaks around 190 MB resident and fits Render's free 512 MB instance
# with room to spare. No credit card is required for the free tier.
#
# Free-tier behaviour: the service sleeps after 15 minutes with no traffic and
# takes ~50 seconds to wake on the next request. 750 instance-hours per month
# covers one service running continuously.

services:
  - type: web
    name: facevision-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DEEP_MODELS_ENABLED
        value: 1
      - key: DETECTOR_BACKEND
        value: yunet
      # RetinaFace needs TensorFlow (~1 GB) and cannot run on the free plan.
      - key: ENABLE_RETINAFACE
        value: 0
      - key: WARM_UP_ON_STARTUP
        value: 1
      # Free instances get a fractional CPU; one ONNX thread avoids thrashing.
      - key: ONNX_THREADS
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: 12
      - key: LOG_LEVEL
        value: INFO
