# Mirrors this repository to a Hugging Face Space on every push to main, so
# "git push" to GitHub is all it takes to redeploy.
#
# One-time setup:
#   1. Create a Docker Space at https://huggingface.co/new-space
#   2. Create a write token at https://huggingface.co/settings/tokens
#   3. In this repo: Settings > Secrets and variables > Actions, add
#        secret   HF_TOKEN     = the write token
#        variable HF_SPACE     = your-username/your-space-name
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and the HF_SPACE variable first."
            exit 1
          fi
          git push --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            HEAD:main
